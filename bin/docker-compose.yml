services:
  postgres:
    image: postgres:17
    container_name: questlab-postgres
    environment:
      POSTGRES_DB: questlab
      POSTGRES_USER: questlab
      POSTGRES_PASSWORD: questlab_dev
    ports:
      - "5432:5432"
    volumes:
      - questlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questlab -d questlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  questlab_pgdata:
